# Static site: publish the repository root as-is, no build step.
[build]
  publish = "."

# Send the bare domain to the www address.
[[redirects]]
  from = "https://dessaumodul.com/*"
  to = "https://www.dessaumodul.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
